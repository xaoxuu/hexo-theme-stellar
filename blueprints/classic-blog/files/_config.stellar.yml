site:
  brand:
    name: My Stellar Blog
    tagline:
      text: Ideas, notes and stories
      hover:
    href: /
  menu:
    items:
      - id: post
        title: Blog
        icon: default:documents
        url: /
        accent: '#1BCDFC'
  footer:
    sections:
      - title: Blog
        items:
          - title: Recent posts
            url: /
          - title: Archives
            url: /blog/archives/

layout:
  profiles:
    home:
      navigation:
        active_menu: post
      sidebar:
        left: [welcome, recent]
        right: []
    blog_index:
      path: /blog/
      navigation:
        active_menu: post
      sidebar:
        left: [welcome, recent]
        right: []
    post:
      navigation:
        active_menu: post
      sidebar:
        left: [related, recent]
        right: [toc]
    wiki_index:
      navigation:
        active_menu: post
    wiki:
      navigation:
        active_menu: post
    notebook_index:
      navigation:
        active_menu: post
    note_index:
      navigation:
        active_menu: post
    note:
      navigation:
        active_menu: post

content:
  article:
    style: tech
    listing:
      pinned_layout: carousel
      card_layout: hero
      show_tags: true
    show_reading_time: true
    footer:
      show_tags: true

extensions:
  search:
    provider: local

{{visual_style}}
