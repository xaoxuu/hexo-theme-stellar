site:
  brand:
    name: Reading Notes
    tagline: A quiet place to think and write
  menu:
    items:
      - type: search
      - id: post
        title: Reading
        icon: default:bookmark
        url: /
        accent: '#73584A'
layout:
  regions:
    topbar: [site_brand, spacer, menu, settings, actions]
    leftbar:
      enabled: false
  profiles:
    post:
      regions:
        topbar:
          widgets: [site_brand, spacer, menu, settings, actions, toc]
        rightbar:
          widgets: []
    wiki_index:
      navigation:
        active_menu: post
    wiki:
      navigation:
        active_menu: post
      regions:
        topbar:
          widgets: [site_brand, spacer, menu, settings, actions, toc]
        rightbar:
          widgets: []
    notebook_index:
      navigation:
        active_menu: post
    note_index:
      navigation:
        active_menu: post
    note:
      navigation:
        active_menu: post
      regions:
        rightbar:
          widgets: []

content:
  article:
    style: story
    paragraph_indent: always
    listing:
      pinned_layout: flat
      card_layout: classic
    show_reading_time: true
    footer:
      show_tags: false

extensions:
  features:
    reveal:
      enabled: false

{{visual_style}}
