site:
  brand:
    name: Reading Notes
    tagline:
      text: A quiet place to think and write
  menu:
    items:
      - id: post
        title: Reading
        icon: default:bookmark
        url: /
        accent: '#73584A'
layout:
  profiles:
    home:
      sidebar:
        left: []
    blog_index:
      sidebar:
        left: []
    post:
      sidebar:
        left: []
        right: [toc]
    wiki_index:
      navigation:
        active_menu: post
    wiki:
      navigation:
        active_menu: post
    notebook_index:
      navigation:
        active_menu: post
    note_index:
      navigation:
        active_menu: post
    note:
      navigation:
        active_menu: post

content:
  article:
    style: story
    paragraph_indent: always
    listing:
      pinned_layout: flat
      card_layout: classic
    show_reading_time: true
    footer:
      show_tags: false

extensions:
  features:
    reveal:
      enabled: false

{{visual_style}}
