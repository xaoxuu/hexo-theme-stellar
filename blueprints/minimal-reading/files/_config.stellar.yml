brand:
  name: Reading Notes
  tagline: A quiet place to think and write
menu:
  items:
    - type: search
    - id: post
      title: Reading
      icon: default:bookmark
      url: /
      accent: '#73584A'

topbar:
  widgets:
    - site_brand
    - spacer
    - menu
    - settings
    - actions
leftbar:
  enabled: false
profiles:
  post:
    topbar:
      widgets:
        - site_brand
        - spacer
        - menu
        - settings
        - actions
        - toc
    rightbar:
      widgets: []
  wiki_index:
    active_menu: post
  wiki:
    active_menu: post
    topbar:
      widgets:
        - site_brand
        - spacer
        - menu
        - settings
        - actions
        - toc
    rightbar:
      widgets: []
  notebook_index:
    active_menu: post
  note_index:
    active_menu: post
  note:
    active_menu: post
    rightbar:
      widgets: []

article:
  style: story
  paragraph_indent: always
  listing:
    pinned_layout: flat
    card_layout: classic
  show_reading_time: true
  footer:
    show_tags: false

features:
  reveal:
    enabled: false

{{visual_style}}
