site:
  brand:
    name: Product Docs
    tagline:
      text: Guides and reference in one place
      hover:
    href: /wiki/
  menu:
    items:
      - id: wiki
        title: Docs
        icon: default:book
        url: /wiki/
        accent: '#1BCDFC'
  footer:
    sections:
      - title: Documentation
        items:
          - title: Docs home
            url: /wiki/
          - title: Getting started
            url: /wiki/docs-reference/getting-started/

layout:
  profiles:
    home:
      navigation:
        active_menu: wiki
      sidebar:
        left: [related, recent]
        right: []
    wiki_index:
      path: /wiki/
      navigation:
        active_menu: wiki
      sidebar:
        left: [related, recent]
        right: []
    wiki:
      navigation:
        active_menu: wiki
      sidebar:
        left: [tree, related]
        right: [toc]
    blog_index:
      navigation:
        active_menu: wiki
    topic_index:
      navigation:
        active_menu: wiki
    post:
      navigation:
        active_menu: wiki
    topic:
      navigation:
        active_menu: wiki
    notebook_index:
      navigation:
        active_menu: wiki
    note_index:
      navigation:
        active_menu: wiki
    note:
      navigation:
        active_menu: wiki
    author:
      navigation:
        active_menu: wiki
    error:
      navigation:
        active_menu: wiki
    page:
      navigation:
        active_menu: wiki

extensions:
  search:
    provider: local

