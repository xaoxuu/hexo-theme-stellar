# =============================================================
# Stellar 主题内置图标（单一数据源）
# -------------------------------------------------------------
# 文件结构：
#   前半部分 —— 主题基础功能（布局 / 小部件 / 数据服务）
#   后半部分 —— 标签插件（{% copy %} / {% chat %} / {% quot %} 等）
#
# 键格式：namespace:icon-name
#
# 值支持三种形态：
#   内联 SVG  —— 原样输出到页面（推荐，fill 用 currentColor 可跟随主题色）
#   URL / 相对路径 —— 自动渲染为 <img src="...">
#   data-URI —— 供 iconData() 用于 background / onerror 等场景
#
# 读取方式：
#   模板 / 标签脚本：icon('key') 或 ctx.utils.icon('key')
#     首屏关键图标（搜索、菜单、leftbar/rightbar、arrow-left）由模板调用处传第三参
#     inline=true 保持内联；其余图标输出 <svg class="icon" data-icon="key"> 占位符，
#     由 /js/icons.js 异步拉取构建期生成的 js/icons/{ns}.json 后原位替换为完整 SVG
#     （最终 DOM 与内联一致，CSS 钩子不受影响）。
#   原始值：hexo.utils.iconData('key')
#   客户端：window.ctx.icons['key']（白名单，见 defines.ejs）
#
# 覆盖机制：站点可在 source/_data/icons.yml 覆盖或补充同名键
#           （站点私有数据，不进入主题仓库）
# 注意：2026-08-15 起主题基础功能图标键统一为 default:语义名（可复用、易识别）；标签插件与 github:/share: 保持原命名空间。
#       站点旧 solar:* 覆盖键需同步改名；非 Solar 值图标统一放在文件顶部「非 Solar 值保留图标」组，逐个注明来源与原因。
#
# 小技巧：更换图标后如果变大或视觉偏移，把原 class / style
#         复制到新图标中；内联 SVG 的 class 写在值内
#          （icon() 对非 URL 结果会忽略附加参数）
# =============================================================



# ================ 非 Solar 值保留图标（来源与原因） ================
