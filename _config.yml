######## head tags ########
seo:
  # 一旦设置主站 host，非主站地址将不会被 SEO 收录，并且访问时弹出提示。
  # 如果访问地址不在 allowed_hosts，则警告信息为非法克隆。
  canonical:
    host: # 例如 xaoxuu.com
    allowed_hosts:
      - localhost
  open_graph:
    enabled: true
    twitter_id:
  structured_data:
    same_as: [] # 作者或组织的公开社交链接

resources:
  preconnect: []
  fallbacks:
    avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
    link_card: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg
    cover: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/cover/76b86c0226ffd.svg
  error_page:
    image: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/404/1c830bfcd517d.svg

inject:
  head_end: ''
  body_end: ''


######## Sidebar ########
site:
  # src/name/tagline 默认分别派生自 Hexo avatar/title/subtitle。
  brand:
    image:
      variant: avatar # avatar: 圆形裁剪；icon: 圆角矩形；plain: 保留透明原图
    href: /

  menu:
    items: []
    # - id: post
    #   accent: '#1BCDFC'
    #   icon: default:documents
    #   title: 博客
    #   url: /

  footer:
    actions: []
    # - type: link
    #   icon: default:github
    #   title: GitHub
    #   url: https://github.com/
    sections: []
    # - title: 博客
    #   items:
    #     - title: 近期发布
    #       url: /
    #     - title: 归档
    #       url: /blog/archives/
    content: |
      本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。


######## Main ########
# 页面 Profile 默认布局
layout:
  profiles:
    # -- 列表类页面 -- #
    # 主页配置
    home:
      navigation:
        active_menu: post
      sidebar:
        left: [welcome, recent]
        right: []
      comments:
        enabled: false
        title:
        id:
        provider:
        options: {}
    # 博客列表页配置
    blog_index:
      path: /blog/ # 只影响自动生成的页面路径
      navigation:
        active_menu: post
        tabs: [] # 近期发布 分类 标签 专栏 归档 and ...
          # - title: 朋友文章
          #   url: /friends/rss/
      sidebar:
        left: [welcome, recent]
        right: []
    # 博客专栏列表页配置
    topic_index:
      path: /topic/ # 只影响自动生成的页面路径
      navigation:
        active_menu: post
      sidebar:
        left: [welcome, recent]
        right: []
    # 文档列表页配置
    wiki_index:
      path: /wiki/ # 只影响自动生成的页面路径
      navigation:
        active_menu: wiki
        tabs: []
          # - title: more
          #   url: https://github.com/xaoxuu
      sidebar:
        left: [related, recent]
        right: []
    # -- 内容类页面 -- #
    # 博客文章内页配置
    post:
      navigation:
        active_menu: post
      sidebar:
        left: [related, recent]
        right: [ghrepo, toc]
    # 博客专栏文章内页配置
    topic:
      navigation:
        active_menu: post
      sidebar:
        left: [related, recent]
        right: [ghrepo, toc]
    # 文档内页配置
    wiki:
      navigation:
        active_menu: wiki
      sidebar:
        left: [tree, related, recent]
        right: [ghrepo, toc]
    # 笔记本列表页配置
    notebook_index:
      path: /notebooks/ # 笔记本列表页路径，以及未指定路径的笔记本前缀。
      navigation:
        active_menu: notebooks
      sidebar:
        left: [recent]
        right: []
    # 笔记列表页配置
    note_index:
      # 笔记列表页和笔记页高亮的主导航栏菜单按钮。
      # 可以在笔记本或笔记的 navigation.menu 中覆盖。
      navigation:
        active_menu: notebooks
      sidebar:
        left: [tagtree, recent]
        right: []
    # 笔记页配置
    note:
      navigation:
        active_menu: notebooks
      # 可以在笔记本 note.sidebar 或笔记 sidebar 中覆盖。
      sidebar:
        left: [tagtree, recent]
        right: [toc]
    # 作者信息配置
    author:
      path: /author/ # 只影响自动生成的页面路径
      navigation:
        active_menu: post
      sidebar:
        left: [recent]
        right: []
    # 错误页配置
    error:
      path: /404.html
      navigation:
        active_menu: post
      sidebar:
        left: [recent]
        right: []
    # 其它自定义页面配置 layout: page
    page:
      navigation:
        active_menu: post
      sidebar:
        left: [recent]
        right: [toc]


######## Content ########
content:
  article:
    # 文章呈现风格，可以在页面或集合的 article.style 中覆盖。
    style: tech # tech: 默认技术类文章, story: 图文类文章，文字和段落间增距大
    # auto: story 缩进、tech 不缩进；always / never 显式覆盖。
    paragraph_indent: auto
    listing:
      # 置顶文章布局：carousel = 轮播，flat = 平铺。
      pinned_layout: carousel
      # 文章卡片布局：hero = 全图文字封面卡片，classic = 普通卡片。
      card_layout: hero
      cover_ratio: 2
      # 没有 excerpt 和 description 时的自动摘要长度。
      excerpt_length: 128
      # 文章卡片是否显示标签（最多 5 个）。
      show_tags: false
    banner:
      ratio: 2.5
    category_colors:
      '探索号': '#f44336'
    footer:
      license: '本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
      share: [] # 可选 wechat / weibo / email / link，空数组关闭。
      show_tags: true
    # 需要安装 hexo-related-popular-posts。
    # 0 关闭，正整数表示最大结果数。
    related_posts_limit: 0
    show_reading_time: false

  notebook:
    listing:
      excerpt_length: 128
      # 0 表示不分页，null 使用 Hexo 的配置。
      per_page: null
      sort:
        field: updated
        direction: desc
    tag_icons: {}
    footer:
      license: null
      share: null

extensions:
  search:
    provider: local # local / algolia
    providers:
      local:
        scope: all # post / page / all
        include_content: true
        cache_ttl_seconds: 86400
      algolia:
        appId:
        apiKey:
        indexName:

  comments:
    provider: # beaudar / utterances / giscus / twikoo / waline / artalk
    title:
    providers:
      beaudar:
        repo: xxx/xxx
        issue-term: pathname
        issue-number:
        theme: preferred-color-scheme
        label:
        input-position: top
        comment-order: desc
        keep-theme:
        loading: false
        branch: main
      utterances:
        repo: xxx/xxx
        issue-term: pathname
        issue-number:
        theme: preferred-color-scheme
        label:
      giscus:
        data-repo: xxx/xxx
        data-repo-id:
        data-category:
        data-category-id:
        data-mapping: pathname
        data-strict: 0
        data-reactions-enabled: 1
        data-emit-metadata: 0
        data-input-position: top
        data-theme: preferred_color_scheme
        data-lang: zh-CN
        data-loading:
        crossorigin: anonymous
      twikoo:
        envId: https://xxx
      waline:
        serverURL: https://waline.vercel.app
        commentCount: true
        pageview: false
      artalk:
        server:
        site: ''
        darkMode: auto
        imageUploader:

  tags:
    note:
      default_color: ''
      border: true
    checkbox:
      interactive: false
    quot:
      default:
        prefix: quot:quote-left
        suffix: quot:quote-right
      hashtag:
        prefix: quot:hashtag
      question:
        prefix: quot:question
    emoji:
      default_source: blobcat
      sources:
        twemoji: https://gcore.jsdelivr.net/gh/twitter/twemoji/assets/svg/{name}.svg
        qq: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/qq/{name}.gif
        aru: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/aru/{name}.gif
        tieba: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/tieba/{name}.png
        blobcat: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/blobcat/{name}.gif
    icon:
      default_color: accent
    button:
      default_color: theme
    mark:
      default_color: yellow
    hashtag:
      default_color:
    gallery:
      size: mix
      aspect_ratio: square

  features:
    lazy_loading:
      transition: fade
      auto_aspect_ratio: true
    link_prefetch:
      enabled: true
    lightbox:
      enabled: true
      selector: .timenode p>img
    reveal:
      enabled: true
      distance: 8px
      duration_ms: 1000
      interval_ms: 100
      scale: 1
    math:
      provider:
      providers:
        katex: {}
        mathjax: {}
    diagrams:
      provider:
      providers:
        mermaid:
          theme: neutral
    card_hover:
      enabled: false
    heti:
      enabled: false

  services:
    site_info:
      endpoint: https://api.xaox.cc/site_info/v1?url={href}
    rating:
      endpoint: https://star-vote.xaox.cc/api/rating
    vote:
      endpoint: https://star-vote.xaox.cc/api/vote
    contributors:
      repositories: []
    github:
      api_url: https://api.github.com
      raw_url: https://raw.githubusercontent.com
      gist_url: https://gist.github.com
    github_card:
      endpoint: https://github-readme-stats.vercel.app

appearance:
  color_scheme: auto # auto / light / dark
  typography:
    font_size:
      root: 16px # 桌面端全局字号基准；移动端自动增加 2px
      inline_code: 85% # 相较于其所在行的文本大小，建议用百分比
      code_block: 0.8125rem # 13px
    font_family:
      body: 'system-ui, "Microsoft Yahei", "Segoe UI", Arial, sans-serif'
      code: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'
    content_align: left
    heading_prefixes:
      h2: '#'
      h3: '='
      h4: '|'
      h5: ':'
  shape:
    corner: superellipse(1.25)
    radius:
      card_large: 24px
      card: 16px
      card_small: 12px
      bar: 12px
      image_large: 24px
      image: 16px
      image_small: 8px
  colors:
    primary: 'hsl(192 98% 55%)'
    accent: 'hsl(14 100% 57%)'
    link: 'hsl(207 90% 54%)'
  gradients:
    primary_action: 'linear-gradient(to right, hsl(215, 95%, 64%), hsl(195, 95%, 60%), hsl(165, 95%, 56%), hsl(165, 95%, 56%), hsl(195 95% 60%), hsl(215, 95%, 64%))'
    search_bar: 'linear-gradient(to right, #04f3ff, #08ffc6, #ddf730, #ffbd19, #ff1fe0, #c418ff, #3b5bff, #04f3ff)'
    avatar_ring: 'conic-gradient(from 0deg, #04f3ff, #08ffc6, #ddf730, #ffbd19, #ff1fe0, #c418ff, #3b5bff, #04f3ff)'
  motion:
    page_transition: true
    avatar: auto # auto / always / never
  code_block:
    scrollbar_width: 4px
    highlight_stylesheet: https://gcore.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/styles/atom-one-dark.min.css
  backgrounds:
    sidebar:
      surface: card # glass / card
      color:
        light: var(--card)
        dark: var(--card)
      image: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg
      opacity: 0.8
      backdrop:
        radius: 100px
        overlay: var(--bg-a60)
    page:
      image: # 例如 https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.14/image/site-bg1@small.webp
      backdrop:
        radius: 100px
        overlay: var(--bg-a75)
        saturation: 300%
