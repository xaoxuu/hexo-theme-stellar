# Stellar v2 theme defaults.
#
# This file is the single source of truth for the public configuration tree,
# default values, ordering and user-facing examples. Site overrides use the
# same shape in `_config.stellar.yml`; arrays replace defaults as a whole.

# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

brand:
  image:
    # Set to null to hide the image.
    src: null
    variant: avatar # avatar | icon | plain
  # null does not inherit Hexo title/subtitle.
  name: null
  tagline: null

menu:
  items:
    - type: search

settings:
  about:
    items:
      - key: 博客框架
        value: Hexo {hexo.version}
        url: https://hexo.io/
      - key: 主题版本
        value: Stellar {theme.version}
        url: '{theme.tree}'

footer:
  actions: []
  sections: []
  # Empty string hides the footer content.
  content: 本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

regions:
  topbar: []
  leftbar:
    default_state: expanded # expanded | collapsed
    enabled: true
    brand: site_brand # site_brand | collection_brand | false
    menu: true
    footer_actions: true
    widgets: []
  rightbar: []

# Profile fields omitted below inherit the site Regions. Empty arrays explicitly
# hide a Topbar/Rightbar or clear a Leftbar widget list.
profiles:
  home:
    active_menu: post
    leftbar:
      widgets: [recent]
    rightbar: []
    comments:
      enabled: false
      title: null
      id: null
      provider: null
      options: {}

  blog_index:
    path: /blog/
    active_menu: post
    leftbar:
      widgets: [recent]
    rightbar: []
    listing_nav:
      enabled: true
      tabs: []

  topic_index:
    path: /topic/
    active_menu: post
    leftbar:
      widgets: [recent]
    rightbar: []

  wiki_index:
    path: /wiki/
    active_menu: wiki
    leftbar:
      widgets: [related, recent]
    rightbar: []
    listing_nav:
      enabled: true
      tabs: []

  post:
    active_menu: post
    leftbar:
      widgets: [related, recent]
    rightbar: [ghrepo, toc]

  topic:
    active_menu: post
    leftbar:
      widgets: [related, recent]
    rightbar: [ghrepo, toc]

  wiki:
    active_menu: wiki
    topbar: []
    leftbar:
      brand: collection_brand
      menu: false
      footer_actions: false
      widgets: [tree]
    rightbar: [ghrepo, toc]

  notebook_index:
    path: /notebooks/
    active_menu: notebooks
    leftbar:
      widgets: [recent]
    rightbar: []

  note_index:
    active_menu: notebooks
    leftbar:
      brand: collection_brand
      widgets: [tagtree, recent]
    rightbar: []

  note:
    active_menu: notebooks
    leftbar:
      brand: collection_brand
      widgets: [tagtree, recent]
    rightbar: [toc]

  author:
    path: /author/
    active_menu: post
    leftbar:
      widgets: [recent]
    rightbar: []

  error:
    path: /404.html
    active_menu: post
    leftbar:
      widgets: [recent]
    rightbar: []

  page:
    active_menu: post
    leftbar:
      widgets: [recent]
    rightbar: [toc]

  settings:
    path: /settings/
    active_menu: null
    leftbar:
      widgets: []
    rightbar: []

# -----------------------------------------------------------------------------
# Content
# -----------------------------------------------------------------------------

article:
  style: tech # tech | story
  paragraph_indent: auto # auto | always | never
  listing:
    pinned_layout: carousel # carousel | flat
    card_layout: hero # hero | classic
    cover_ratio: 2
    excerpt_length: 128
    show_tags: false
  banner:
    ratio: 2.5
  category_colors:
    探索号: '#f44336'
  footer:
    license: 本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。
    share: []
    show_tags: true
  related_posts_limit: 0
  show_reading_time: false

notebook:
  listing:
    excerpt_length: 128
    per_page: null
    sort:
      field: updated # date | updated | title
      direction: desc # asc | desc
  tag_icons: {}
  footer:
    # null inherits the corresponding article footer value.
    license: null
    share: null

# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------

appearance:
  preset: card # card | glass | minimal | flat
  color_scheme: auto # auto | light | dark

  typography:
    font_size:
      root: 16px
      inline_code: 85%
      code_block: 0.8125rem
    font_family:
      body: system-ui, "Microsoft Yahei", "Segoe UI", Arial, sans-serif
      code: Menlo, Monaco, Consolas, system-ui, monospace, sans-serif
    content_align: left
    heading_prefixes: {h2: '#', h3: '=', h4: '|', h5: ':'}

  shape:
    corner: superellipse(1.25)
    radius:
      card_large: 24px
      card: 16px
      card_small: 12px
      bar: 12px
      image_large: 24px
      image: 16px
      image_small: 8px

  colors:
    primary: hsl(192 98% 55%)
    accent: hsl(14 100% 57%)
    link: hsl(207 90% 54%)

  gradients:
    primary_action: linear-gradient(to right, hsl(215, 95%, 64%), hsl(195, 95%, 60%), hsl(165, 95%, 56%), hsl(165, 95%, 56%), hsl(195 95% 60%), hsl(215, 95%, 64%))
    search_bar: 'linear-gradient(to right, #04f3ff, #08ffc6, #ddf730, #ffbd19, #ff1fe0, #c418ff, #3b5bff, #04f3ff)'

  code_block:
    scrollbar_width: 4px
    highlight_stylesheet: https://gcore.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/styles/atom-one-dark.min.css

  backgrounds:
    leftbar:
      type: gradient # none | gradient | image
      image: null
      gradient:
        light: [hsl(210 32% 84%), hsl(188 44% 84%), hsl(12 64% 73%), hsl(35 100% 82%)]
        dark: [hsl(210 16% 48%), hsl(188 18% 50%), hsl(12 30% 42%), hsl(35 36% 49%)]
      opacity: 1
      backdrop:
        radius: 100px
    page:
      image: null
      backdrop:
        radius: 100px
        overlay: var(--bg-a75)
        saturation: 300%

# -----------------------------------------------------------------------------
# SEO
# -----------------------------------------------------------------------------

canonical:
  host: null
  allowed_hosts: [localhost]

open_graph:
  enabled: true
  twitter_id: null

structured_data:
  same_as: []

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------

preconnect: []

fallbacks:
  avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
  link_card: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg
  cover: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/cover/76b86c0226ffd.svg

error_page:
  image: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/404/1c830bfcd517d.svg

# -----------------------------------------------------------------------------
# Extensions
# -----------------------------------------------------------------------------

search:
  provider: local # local | algolia | null
  local:
    scope: all
    include_content: true
    cache_ttl_seconds: 86400
  algolia: {appId: null, apiKey: null, indexName: null}

comments:
  provider: null # beaudar | utterances | giscus | twikoo | waline | artalk | null
  title: null
  beaudar: {repo: xxx/xxx, issue-term: pathname, issue-number: null, theme: preferred-color-scheme, label: null, input-position: top, comment-order: desc, keep-theme: null, loading: false, branch: main}
  utterances: {repo: xxx/xxx, issue-term: pathname, issue-number: null, theme: preferred-color-scheme, label: null}
  giscus: {data-repo: xxx/xxx, data-repo-id: null, data-category: null, data-category-id: null, data-mapping: pathname, data-strict: 0, data-reactions-enabled: 1, data-emit-metadata: 0, data-input-position: top, data-theme: preferred_color_scheme, data-lang: zh-CN, data-loading: null, crossorigin: anonymous}
  twikoo: {envId: https://xxx}
  waline: {serverURL: https://waline.vercel.app, commentCount: true, pageview: false}
  artalk: {server: null, site: '', darkMode: auto, imageUploader: null}

tags:
  note: {default_color: '', border: true}
  checkbox: {interactive: false}
  quot:
    default: {prefix: 'quot:quote-left', suffix: 'quot:quote-right'}
    hashtag: {prefix: 'quot:hashtag', suffix: null}
    question: {prefix: 'quot:question', suffix: null}
  emoji:
    default_source: blobcat
    sources:
      twemoji: https://gcore.jsdelivr.net/gh/twitter/twemoji/assets/svg/{name}.svg
      qq: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/qq/{name}.gif
      aru: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/aru/{name}.gif
      tieba: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/tieba/{name}.png
      blobcat: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/blobcat/{name}.gif
  icon: {default_color: accent}
  button: {default_color: theme}
  mark: {default_color: yellow}
  hashtag: {default_color: null}
  gallery: {size: mix, aspect_ratio: square}

features:
  lazy_loading: {transition: fade, auto_aspect_ratio: true}
  link_prefetch: {enabled: true}
  color_scheme_switch: {enabled: false}
  lightbox: {enabled: true, selector: '.timenode p>img'}
  reveal: {enabled: true}
  math:
    provider: null
    katex: {}
    mathjax: {}
  diagrams:
    provider: null
    mermaid: {theme: neutral}
  card_hover: {enabled: false}
  heti: {enabled: false}

services:
  site_info:
    provider: site_info_api
    site_info_api:
      endpoint: https://api.xaox.cc/site_info/v1?url={href}
  rating:
    provider: star_vote
    star_vote:
      endpoint: https://star-vote.xaox.cc/api/rating
  vote:
    provider: star_vote
    star_vote:
      endpoint: https://star-vote.xaox.cc/api/vote
  contributors:
    provider: github
    github:
      repositories: []
  github:
    api_url: https://api.github.com
    raw_url: https://raw.githubusercontent.com
    gist_url: https://gist.github.com
  github_card:
    provider: github_readme_stats
    github_readme_stats:
      endpoint: https://github-readme-stats.vercel.app

# -----------------------------------------------------------------------------
# Trusted injection
# -----------------------------------------------------------------------------

inject:
  head_end: ''
  body_end: ''
