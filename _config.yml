# Stellar v2 主题默认配置。
# 由 scripts/schema/config-schema.js 自动生成，请勿手工编辑。
# 注释格式：用途与空值行为。[类型；枚举、范围或元素类型]
# 修改 CONFIG_SCHEMA 后运行 `npm run schema:generate`。

# 站点身份、菜单与 Footer。 [对象]
site:
  # Brand 系统 Widget 使用的站点品牌业务数据。 [对象]
  brand:
    image:
      # Brand 图片来源；null 隐藏图片且不会继承 Hexo avatar。 [字符串或null]
      # Example:
      #   /avatar.webp
      src: null
      # Brand 图片呈现方式。 [字符串；可选值：avatar / icon / plain]
      variant: avatar
    # Brand 纯文本名称；null 隐藏名称且不会继承 Hexo title。 [字符串或null]
    name: null
    # Brand 标语；null 隐藏标语且不会继承 Hexo subtitle。 [字符串或null]
    tagline: null
  # 站点主导航菜单。 [对象]
  menu:
    # 主导航菜单项；type: search 与链接共用 title、icon、accent 视觉字段并提供共享搜索入口，空数组不显示主菜单。 [数组；元素：对象]
    # Example:
    #   - {type: search, title: 搜索, icon: default:search}
    #   - {id: post, title: 博客, icon: default:documents, url: /, accent: '#1BCDFC'}
    items: [{type: search}]
  # 设置页的站点信息配置。 [对象]
  settings:
    # 设置页 About 区的 KV 列表。 [对象]
    about:
      # About KV 项；默认包含博客框架和主题版本，显式数组整体覆盖，空数组显示空状态。 [数组；元素：对象]
      items: [{key: 博客框架, value: 'Hexo {hexo.version}', url: https://hexo.io/}, {key: 主题版本, value: 'Stellar {theme.version}', url: '{theme.tree}'}]
  # Actions 系统 Widget 与主内容区页脚使用的站点数据。 [对象]
  footer:
    # Actions 系统 Widget 的操作项；空数组不显示操作区。 [数组；元素：对象]
    # Example:
    #   - {type: link, icon: default:github, title: GitHub, url: https://github.com/}
    actions: []
    # 主内容区页脚导航分栏；空数组不显示分栏。 [数组；元素：对象]
    # Example:
    #   - {title: 博客, items: [{title: 归档, url: /blog/archives/}]}
    sections: []
    # 页脚正文；支持 Markdown 与主题模板变量，空字符串不显示。 [字符串]
    content: 本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。

# 页面 Profile 的路由、导航与侧边栏默认值。 [对象]
layout:
  # 站点级 Topbar、Leftbar 与 Rightbar Region。 [对象]
  regions:
    topbar:
      # 站点级 Topbar Widget；按声明顺序显示。 [数组；元素：字符串或对象]
      widgets: []
    leftbar:
      # 桌面 Leftbar 首次访问时的默认状态。 [字符串；可选值：expanded / collapsed]
      default_state: expanded
      # 是否生成站点级 Leftbar。 [布尔值]
      enabled: true
      # Leftbar 固定 Brand 来源；false 隐藏 Brand。 [字符串或布尔值；可选值：false / site_brand / collection_brand]
      brand: site_brand
      # 是否显示 Leftbar 固定 Menu。 [布尔值]
      menu: true
      footer:
        # 是否显示 Leftbar Footer 固定 Actions。 [布尔值]
        actions: true
      # 站点级 Leftbar 内容 Widget；显式数组整体覆盖上层值。 [数组；元素：字符串或对象]
      widgets: []
    rightbar:
      # 站点级正文旁 Rightbar Widget；按声明顺序显示。 [数组；元素：字符串或对象]
      widgets: []
  # 各页面类型的路径、导航与 Region 默认值。 [对象]
  profiles:
    # 主页的布局默认值。 [对象]
    home:
      navigation:
        # 主页高亮的主菜单项；null 表示不高亮。 [字符串或null]
        active_menu: post
      regions:
        topbar:
          # 主页显式覆盖的 Topbar Widgets。 [数组或null；元素：字符串或对象]
          widgets: null
        leftbar:
          # 主页是否生成 Leftbar；null 继承上层。 [布尔值或null]
          enabled: null
          # 主页固定 Brand 来源；false 隐藏，null 继承上层。 [字符串或布尔值或null；可选值：null / false / site_brand / collection_brand]
          brand: null
          # 主页是否显示固定 Menu；null 继承上层。 [布尔值或null]
          menu: null
          footer:
            # 主页是否显示固定 Footer Actions；null 继承上层。 [布尔值或null]
            actions: null
          # 主页显式覆盖的 Leftbar 内容 Widgets。 [数组或null；元素：字符串或对象]
          widgets: [recent]
        rightbar:
          # 主页显式覆盖的 Rightbar Widgets。 [数组或null；元素：字符串或对象]
          widgets: []
      comments:
        # 是否显示主页评论区。 [布尔值]
        enabled: false
        # 主页评论区标题；null 使用默认评论标题。 [字符串或null]
        title: null
        # 主页评论线程的稳定标识；null 由页面上下文决定。 [字符串或null]
        id: null
        # 主页专用评论 Provider；null 使用全局评论 Provider。 [字符串或null；可选值：null / beaudar / utterances / giscus / twikoo / waline / artalk]
        provider: null
        # 主页专用评论 Provider 参数。 [对象；允许自定义键]
        options: {}
    # 博客列表页的布局默认值。 [对象]
    blog_index:
      navigation:
        # 博客列表页高亮的主菜单项；null 表示不高亮。 [字符串或null]
        active_menu: post
      regions:
