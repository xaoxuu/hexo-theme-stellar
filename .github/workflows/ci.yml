name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  contributions:
    name: Contribution registry consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contributions:check

  commit-gate:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: node ci/check-commit-msg.js "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  skill-sync:
    name: Skill mirror sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node ci/check-skill-sync.js --check

  integration:
    name: Integration build (package + minify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect runtime changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          should_run=false
          while IFS= read -r file; do
            case "$file" in
              layout/*|scripts/*|source/css/*|source/js/*|languages/*|_data/*|_config.yml|package.json|package-lock.json|ci/check-package-integration.js|ci/gulpfile.js|test/package-integration.test.js|.npmignore|.github/workflows/ci.yml)
                should_run=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "run=$should_run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      - name: Skip unchanged runtime
        if: steps.scope.outputs.run != 'true'
        run: echo "Runtime inputs unchanged; integration build skipped."

      - name: Install theme dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Verify installed package and host postprocessing
        if: steps.scope.outputs.run == 'true'
        run: npm run integration:check

  knowledge:
    name: Knowledge base verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify changed knowledge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- docs/knowledge; then
            echo "Knowledge base unchanged; deferred release snapshot remains valid."
          else
            npm ci
            npm run knowledge:check
          fi
