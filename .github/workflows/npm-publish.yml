name: npm-publish

on:
  push:
    branches:
      - npm

permissions:
  id-token: write  # 需要给 GitHub Action 添加 id-token 权限，否则无法生成 OIDC 令牌
  contents: write  # Required for creating git tags

jobs:
  npm-publish:
    name: npm-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24  # npm CLI 的版本需要在 11.5.1 版本或以上才支持 OIDC
          registry-url: https://registry.npmjs.org

      - name: Check if this is a release commit
        id: is_release
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qE '^release:\ '; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Skipping: latest commit is not a release commit"
          fi

      - name: Extract version from package.json
        if: steps.is_release.outputs.is_release == 'true'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version already published
        if: steps.is_release.outputs.is_release == 'true'
        id: check
        run: |
          PKG="hexo-theme-stellar"
          VER="${{ steps.version.outputs.version }}"
          PUBLISHED=$(npm view "$PKG" versions --json 2>/dev/null | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).includes('$VER') ? 'true' : 'false')")
          echo "skip=$PUBLISHED" >> $GITHUB_OUTPUT

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public

      # 不再需要配置 NPM TOKEN

      - name: Create Git tag
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
