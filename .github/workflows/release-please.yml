name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'xaoxuu/hexo-theme-stellar'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/workflows/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main
